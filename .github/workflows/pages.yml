name: Deploy to GitHub Pages

# The app is plain static files, so there is nothing to build — the repository
# root is uploaded as-is.

on:
  push:
    # GitHub's auto-created `github-pages` environment only accepts deployments
    # from the repository's DEFAULT branch. This repo's default is still the
    # branch it was first pushed with, so deploying from `main` alone is
    # rejected before the job even starts. Listing both keeps deploys working
    # now and continues to work if the default is later moved to `main`.
    branches:
      - main
      - claude/home-workout-webapp-15b8uf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do not cancel in flight. Pushing the same commit to two branches used to
  # start two runs in this group, and the second killed the first mid-deploy.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The `github-pages` environment only accepts deployments from the default
    # branch, so a run on any other branch is rejected before it starts. Skip
    # those instead, which keeps them grey rather than red and means this needs
    # no edit whenever the default branch changes.
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Best effort: creates the Pages site automatically where the workflow
          # token is allowed to. It often is not — GITHUB_TOKEN cannot create a
          # Pages site without repository admin rights, and fails with
          # "Resource not accessible by integration". In that case enable Pages
          # once by hand (Settings → Pages → Source → GitHub Actions); this step
          # then finds the existing site and the deploy proceeds normally.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

# The app is plain static files, so there is nothing to build — the repository
# root is uploaded as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Best effort: creates the Pages site automatically where the workflow
          # token is allowed to. It often is not — GITHUB_TOKEN cannot create a
          # Pages site without repository admin rights, and fails with
          # "Resource not accessible by integration". In that case enable Pages
          # once by hand (Settings → Pages → Source → GitHub Actions); this step
          # then finds the existing site and the deploy proceeds normally.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
